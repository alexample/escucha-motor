plugins {
    id 'com.android.application'
}

android {
    namespace 'es.escuchamotor'
    compileSdk 34

    defaultConfig {
        applicationId 'es.escuchamotor'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        // Clave fija incluida en el repositorio para que cada nueva versión
        // se instale encima de la anterior sin perder las fichas.
        app {
            storeFile rootProject.file('keystore/escucha-motor.jks')
            storePassword 'escuchamotor'
            keyAlias 'escuchamotor'
            keyPassword 'escuchamotor'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
        debug {
            signingConfig signingConfigs.app
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
